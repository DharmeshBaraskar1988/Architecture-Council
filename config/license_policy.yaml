non_commercial_markers: [CC-BY-NC-4.0, CC-BY-NC-SA-4.0, research-only, non-commercial]
# Model weights often use custom licences (e.g. "llama3.3"): treated as review_needed unless listed here.
model_licences_allowed: [Apache-2.0, MIT]
